# Installed by g15-fanctl. See docs/01-hardware-research.md section 4 for why
# `force=1` is required and why it's safe: this is a documented upstream module
# parameter (Documentation/hwmon/dell-smm-hwmon.rst), not a hardware hack — it only
# controls whether the module attempts to bind on a model outside its DMI
# whitelist; the SMM read/write handshake logic is unchanged either way.
options dell_smm_hwmon force=1 fan_mult=1 fan_max=3
