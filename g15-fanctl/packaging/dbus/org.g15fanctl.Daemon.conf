<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root (the systemd service) may own this well-known name. -->
  <policy user="root">
    <allow own="org.g15fanctl.Daemon"/>
  </policy>

  <!-- Any local user may call read-only and mutating methods on the daemon;
       the daemon itself does not further gate individual method calls by
       caller UID today (see docs/05-safety.md "Threat model" section for the
       reasoning: this is a single-user laptop fan controller, not a
       multi-tenant service). If you want per-method polkit gating instead of
       blanket allow, see packaging/polkit/org.g15fanctl.policy and wire it
       into dbus_service.rs's mutating methods. -->
  <policy context="default">
    <allow send_destination="org.g15fanctl.Daemon"
           send_interface="org.g15fanctl.Daemon1"/>
    <allow receive_sender="org.g15fanctl.Daemon"/>
  </policy>
</busconfig>
